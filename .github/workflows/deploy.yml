name: Deploy to GitHub Pages

on:
  push:
  branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './mesa-facil-pos/package-lock.json' # o yarn.lock

      - name: Install dependencies & Build
        run: |
          cd mesa-facil-pos
          npm install
          npm run build # (O el comando de compilación que uses, ej. vite build)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Usualmente Vite genera la salida en una carpeta llamada 'dist' o 'build' dentro de mesa-facil-pos
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './mesa-facil-pos/dist' # Cambia 'dist' por la carpeta de salida real de tu build (ej. 'build')

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
